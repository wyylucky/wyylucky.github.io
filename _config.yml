# Site
title: 网络安全学习笔记
subtitle: 记录成长，分享知识
description: Web安全 | 二进制安全 | CTF | 漏洞分析
author: YourName
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://yourname.github.io
root: /
permalink: posts/:abbrlink.html
abbrlink:
  alg: crc32
  rep: hex

# Directory
source_dir: source
public_dir: public
tag_dir: tags
category_dir: categories
archive_dir: archives

# Writing
new_post_name: :title.md
default_layout: post
auto_spacing: true
titlecase: false

# 安全相关：禁用代码高亮行号（避免敏感信息泄露）
highlight:
  line_number: false
  wrap: true

# 不渲染私有内容目录
skip_render:
  - private/**

# Deployment
deploy:
  type: git
  repo: git@github.com:yourname/yourname.github.io.git
  branch: master